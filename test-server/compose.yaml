services:
  db:
    image: postgres:17.2-alpine3.21
    container_name: noscore-e2e-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=noscore
    ports:
      - "5432:5432"
    networks:
      - noscore-e2e-network

  master:
    build:
      context: .
      dockerfile: Dockerfile
    image: noscore-e2e-stack
    container_name: noscore-e2e-master
    restart: unless-stopped
    environment:
      - PORT=5000
      - DB_HOST=db
      - WEBAPI_HOST=http://master
    command: ["NosCore.MasterServer.dll"]
    ports:
      - "5000:5000"
    networks:
      - noscore-e2e-network
    volumes:
      - ./configuration/:/configuration

  world:
    image: noscore-e2e-stack
    container_name: noscore-e2e-world
    restart: unless-stopped
    environment:
      - WEBAPI_PORT=5001
      - WEBAPI_HOST=http://world
      - WORLD_PORT=1337
      - MASTER_HOST=http://master
      - DB_HOST=db
      - HOST=0.0.0.0
    command: ["NosCore.WorldServer.dll"]
    ports:
      - "5001:5001"
      - "1337:1337"
    networks:
      - noscore-e2e-network
    volumes:
      - ./configuration/:/configuration

  login:
    image: noscore-e2e-stack
    container_name: noscore-e2e-login
    restart: unless-stopped
    environment:
      - LOGIN_PORT=4000
      - MASTER_HOST=http://master
      - DB_HOST=db
      - HOST=0.0.0.0
    command: ["NosCore.LoginServer.dll"]
    ports:
      - "4000:4000"
    networks:
      - noscore-e2e-network
    volumes:
      - ./configuration/:/configuration

networks:
  noscore-e2e-network:
    driver: bridge
